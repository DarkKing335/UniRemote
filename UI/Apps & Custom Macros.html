<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Space+Grotesk:wght@700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-fixed-dim": "#49a8fc",
                        "surface-container-highest": "#262627",
                        "surface-container-low": "#131314",
                        "inverse-surface": "#fcf8f9",
                        "on-secondary": "#4c5355",
                        "surface-dim": "#0e0e0f",
                        "tertiary": "#64b3ff",
                        "on-tertiary-fixed": "#00192f",
                        "surface": "#0e0e0f",
                        "on-tertiary-fixed-variant": "#003c65",
                        "primary-fixed-dim": "#00e5ee",
                        "on-primary-fixed-variant": "#006266",
                        "inverse-primary": "#006a6e",
                        "secondary-container": "#41484a",
                        "on-primary-container": "#00575b",
                        "surface-variant": "#262627",
                        "on-tertiary-container": "#002440",
                        "surface-container": "#1a191b",
                        "secondary": "#dde4e6",
                        "on-error": "#490006",
                        "on-error-container": "#ffa8a3",
                        "on-primary": "#006165",
                        "on-secondary-container": "#cad1d4",
                        "error": "#ff716c",
                        "on-surface-variant": "#adaaab",
                        "tertiary-dim": "#41a3f7",
                        "primary": "#a1faff",
                        "inverse-on-surface": "#565556",
                        "on-surface": "#ffffff",
                        "on-background": "#ffffff",
                        "on-tertiary": "#003053",
                        "outline-variant": "#484849",
                        "on-secondary-fixed": "#394043",
                        "surface-container-lowest": "#000000",
                        "error-container": "#9f0519",
                        "surface-container-high": "#201f21",
                        "outline": "#767576",
                        "error-dim": "#d7383b",
                        "primary-fixed": "#00f4fe",
                        "tertiary-container": "#45a6fa",
                        "on-primary-fixed": "#004346",
                        "primary-container": "#00f4fe",
                        "secondary-dim": "#cfd6d8",
                        "secondary-fixed": "#dde4e6",
                        "primary-dim": "#00e5ee",
                        "on-secondary-fixed-variant": "#565d5f",
                        "tertiary-fixed": "#6bb6ff",
                        "surface-bright": "#2c2c2d",
                        "secondary-fixed-dim": "#cfd6d8",
                        "background": "#0e0e0f",
                        "surface-tint": "#a1faff"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-card {
            background: rgba(38, 38, 39, 0.4);
            backdrop-filter: blur(12px);
        }

        .tonal-shift {
            background-color: #131314;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background text-on-surface font-body min-h-screen pb-32">
    <!-- TopAppBar -->
    <header
        class="fixed top-0 w-full z-50 bg-[#0e0e0f] shadow-[0_0_20px_rgba(0,245,255,0.08)] flex justify-between items-center px-6 h-16 w-full">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-[#a1faff]" data-icon="settings_remote">settings_remote</span>
            <h1 class="font-['Space_Grotesk'] font-black text-xl tracking-widest uppercase text-[#a1faff]">Digital Pilot
            </h1>
        </div>
        <button
            class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#2c2c2d] transition-colors active:scale-95 duration-200">
            <span class="material-symbols-outlined text-[#a1faff]"
                data-icon="power_settings_new">power_settings_new</span>
        </button>
    </header>
    <main class="pt-24 px-6 max-w-5xl mx-auto space-y-12">
        <!-- App Launcher Section -->
        <section>
            <div class="flex items-end justify-between mb-8">
                <div>
                    <span
                        class="font-label text-[10px] uppercase tracking-[0.2rem] text-on-surface-variant mb-1 block">Ecosystem</span>
                    <h2 class="font-headline text-3xl font-bold tracking-tight text-on-surface">Synchronized Apps</h2>
                </div>
                <div
                    class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant text-xs font-bold tracking-widest uppercase">
                    <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span> Live Sync
                </div>
            </div>
            <!-- App Grid (Bento Style) -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Netflix -->
                <button
                    class="group relative overflow-hidden aspect-square rounded-2xl bg-surface-container-high hover:bg-surface-bright transition-all duration-300 flex flex-col items-center justify-center gap-4">
                    <div
                        class="absolute inset-0 bg-gradient-to-br from-red-600/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
                    </div>
                    <div
                        class="w-16 h-16 rounded-2xl glass-card flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-500">
                        <span class="material-symbols-outlined text-4xl text-red-600" data-icon="movie"
                            style="font-variation-settings: 'FILL' 1;">movie</span>
                    </div>
                    <span
                        class="font-label text-sm font-bold tracking-wider uppercase text-on-surface-variant group-hover:text-on-surface">Netflix</span>
                </button>
                <!-- YouTube -->
                <button
                    class="group relative overflow-hidden aspect-square rounded-2xl bg-surface-container-high hover:bg-surface-bright transition-all duration-300 flex flex-col items-center justify-center gap-4">
                    <div
                        class="absolute inset-0 bg-gradient-to-br from-red-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
                    </div>
                    <div
                        class="w-16 h-16 rounded-2xl glass-card flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-500">
                        <span class="material-symbols-outlined text-4xl text-red-500" data-icon="play_circle"
                            style="font-variation-settings: 'FILL' 1;">play_circle</span>
                    </div>
                    <span
                        class="font-label text-sm font-bold tracking-wider uppercase text-on-surface-variant group-hover:text-on-surface">YouTube</span>
                </button>
                <!-- Prime Video -->
                <button
                    class="group relative overflow-hidden aspect-square rounded-2xl bg-surface-container-high hover:bg-surface-bright transition-all duration-300 flex flex-col items-center justify-center gap-4">
                    <div
                        class="absolute inset-0 bg-gradient-to-br from-blue-400/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
                    </div>
                    <div
                        class="w-16 h-16 rounded-2xl glass-card flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-500">
                        <span class="material-symbols-outlined text-4xl text-blue-400" data-icon="shop_two"
                            style="font-variation-settings: 'FILL' 1;">shop_two</span>
                    </div>
                    <span
                        class="font-label text-sm font-bold tracking-wider uppercase text-on-surface-variant group-hover:text-on-surface">Prime
                        Video</span>
                </button>
                <!-- Spotify -->
                <button
                    class="group relative overflow-hidden aspect-square rounded-2xl bg-surface-container-high hover:bg-surface-bright transition-all duration-300 flex flex-col items-center justify-center gap-4">
                    <div
                        class="absolute inset-0 bg-gradient-to-br from-green-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
                    </div>
                    <div
                        class="w-16 h-16 rounded-2xl glass-card flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-500">
                        <span class="material-symbols-outlined text-4xl text-green-500" data-icon="music_note"
                            style="font-variation-settings: 'FILL' 1;">music_note</span>
                    </div>
                    <span
                        class="font-label text-sm font-bold tracking-wider uppercase text-on-surface-variant group-hover:text-on-surface">Spotify</span>
                </button>
            </div>
        </section>
        <!-- Custom Macros Section -->
        <section>
            <div class="flex flex-col mb-8">
                <span
                    class="font-label text-[10px] uppercase tracking-[0.2rem] text-on-surface-variant mb-1 block">Automation</span>
                <h2 class="font-headline text-3xl font-bold tracking-tight text-on-surface">Custom Macros</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Movie Night Macro -->
                <button
                    class="group relative h-48 rounded-3xl overflow-hidden bg-surface-container-high hover:shadow-[0_0_40px_rgba(161,250,255,0.15)] transition-all duration-500">
                    <div class="absolute inset-0 opacity-20 group-hover:opacity-40 transition-opacity duration-700 bg-[url('image-movie-night-abstract')] bg-cover bg-center"
                        data-alt="Abstract cinematic dark blue and teal light patterns"></div>
                    <div
                        class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-transparent to-transparent">
                    </div>
                    <div class="relative h-full p-8 flex flex-col justify-between items-start text-left">
                        <div class="p-3 rounded-2xl bg-primary/10 border border-primary/20">
                            <span class="material-symbols-outlined text-primary text-3xl" data-icon="nightlight"
                                style="font-variation-settings: 'FILL' 1;">nightlight</span>
                        </div>
                        <div>
                            <h3 class="font-headline text-2xl font-bold text-on-surface">Movie Night</h3>
                            <p class="text-on-surface-variant text-sm mt-1">Dim lights 15%, Open Netflix, Set Audio to
                                Theater</p>
                        </div>
                    </div>
                    <div
                        class="absolute top-8 right-8 w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center group-hover:bg-primary group-hover:border-primary transition-all duration-300">
                        <span class="material-symbols-outlined group-hover:text-surface-dim" data-icon="play_arrow"
                            style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    </div>
                </button>
                <!-- Gaming Mode Macro -->
                <button
                    class="group relative h-48 rounded-3xl overflow-hidden bg-surface-container-high hover:shadow-[0_0_40px_rgba(255,113,108,0.15)] transition-all duration-500">
                    <div class="absolute inset-0 opacity-20 group-hover:opacity-40 transition-opacity duration-700 bg-[url('image-gaming-setup-abstract')] bg-cover bg-center"
                        data-alt="Abstract neon violet and red pixelated light patterns"></div>
                    <div
                        class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-transparent to-transparent">
                    </div>
                    <div class="relative h-full p-8 flex flex-col justify-between items-start text-left">
                        <div class="p-3 rounded-2xl bg-error/10 border border-error/20">
                            <span class="material-symbols-outlined text-error text-3xl" data-icon="videogame_asset"
                                style="font-variation-settings: 'FILL' 1;">videogame_asset</span>
                        </div>
                        <div>
                            <h3 class="font-headline text-2xl font-bold text-on-surface">Gaming Mode</h3>
                            <p class="text-on-surface-variant text-sm mt-1">Switch to HDMI 2, Enable Game Mode, Boost
                                Bass</p>
                        </div>
                    </div>
                    <div
                        class="absolute top-8 right-8 w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center group-hover:bg-error group-hover:border-error transition-all duration-300">
                        <span class="material-symbols-outlined group-hover:text-surface-dim" data-icon="play_arrow"
                            style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    </div>
                </button>
                <!-- Evening Chill -->
                <button
                    class="group relative h-48 rounded-3xl overflow-hidden bg-surface-container-high hover:shadow-[0_0_40px_rgba(0,229,238,0.15)] transition-all duration-500">
                    <div class="absolute inset-0 opacity-20 group-hover:opacity-40 transition-opacity duration-700 bg-[url('image-evening-relax')] bg-cover bg-center"
                        data-alt="Abstract soft warm orange and deep purple gradients"></div>
                    <div
                        class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-transparent to-transparent">
                    </div>
                    <div class="relative h-full p-8 flex flex-col justify-between items-start text-left">
                        <div class="p-3 rounded-2xl bg-primary-fixed-dim/10 border border-primary-fixed-dim/20">
                            <span class="material-symbols-outlined text-primary-fixed-dim text-3xl"
                                data-icon="filter_vintage"
                                style="font-variation-settings: 'FILL' 1;">filter_vintage</span>
                        </div>
                        <div>
                            <h3 class="font-headline text-2xl font-bold text-on-surface">Evening Chill</h3>
                            <p class="text-on-surface-variant text-sm mt-1">Warm lights, Lo-Fi Spotify, Mute
                                notifications</p>
                        </div>
                    </div>
                    <div
                        class="absolute top-8 right-8 w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center group-hover:bg-primary-fixed-dim group-hover:border-primary-fixed-dim transition-all duration-300">
                        <span class="material-symbols-outlined group-hover:text-surface-dim" data-icon="play_arrow"
                            style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    </div>
                </button>
                <!-- All Off Macro -->
                <button
                    class="group relative h-48 rounded-3xl overflow-hidden bg-surface-container-high hover:shadow-[0_0_40px_rgba(173,170,171,0.15)] transition-all duration-500">
                    <div
                        class="absolute inset-0 opacity-20 group-hover:opacity-40 transition-opacity duration-700 bg-surface-container-highest">
                    </div>
                    <div
                        class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-transparent to-transparent">
                    </div>
                    <div class="relative h-full p-8 flex flex-col justify-between items-start text-left">
                        <div class="p-3 rounded-2xl bg-on-surface-variant/10 border border-on-surface-variant/20">
                            <span class="material-symbols-outlined text-on-surface-variant text-3xl" data-icon="bedtime"
                                style="font-variation-settings: 'FILL' 1;">bedtime</span>
                        </div>
                        <div>
                            <h3 class="font-headline text-2xl font-bold text-on-surface">Night Cycle</h3>
                            <p class="text-on-surface-variant text-sm mt-1">Shutdown all devices, Lock doors, Arm
                                security</p>
                        </div>
                    </div>
                    <div
                        class="absolute top-8 right-8 w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center group-hover:bg-on-surface-variant group-hover:border-on-surface-variant transition-all duration-300">
                        <span class="material-symbols-outlined group-hover:text-surface-dim" data-icon="play_arrow"
                            style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    </div>
                </button>
            </div>
        </section>
    </main>
    <!-- BottomNavBar -->
    <nav
        class="fixed bottom-0 left-0 w-full z-50 rounded-t-[2rem] bg-[#0e0e0f]/60 backdrop-blur-xl shadow-[0_-8px_32px_rgba(0,0,0,0.5)] flex justify-around items-center px-4 pb-6 pt-2 h-24">
        <!-- Remote -->
        <a class="flex flex-col items-center justify-center text-[#adaaab] p-3 hover:text-[#a1faff] transition-all active:scale-90 duration-300 ease-out"
            href="#">
            <span class="material-symbols-outlined text-2xl mb-1" data-icon="settings_remote">settings_remote</span>
            <span class="font-['Inter'] text-[10px] uppercase tracking-[0.1rem] font-bold">Remote</span>
        </a>
        <!-- Apps (Active) -->
        <a class="flex flex-col items-center justify-center bg-gradient-to-br from-[#a1faff] to-[#00f4fe] text-[#0e0e0f] rounded-full p-4 shadow-[0_0_15px_rgba(161,250,255,0.5)] active:scale-90 duration-300 ease-out"
            href="#">
            <span class="material-symbols-outlined text-2xl mb-1" data-icon="apps"
                style="font-variation-settings: 'FILL' 1;">apps</span>
            <span class="font-['Inter'] text-[10px] uppercase tracking-[0.1rem] font-bold">Apps</span>
        </a>
        <!-- Cast -->
        <a class="flex flex-col items-center justify-center text-[#adaaab] p-3 hover:text-[#a1faff] transition-all active:scale-90 duration-300 ease-out"
            href="#">
            <span class="material-symbols-outlined text-2xl mb-1" data-icon="cast">cast</span>
            <span class="font-['Inter'] text-[10px] uppercase tracking-[0.1rem] font-bold">Cast</span>
        </a>
        <!-- Settings -->
        <a class="flex flex-col items-center justify-center text-[#adaaab] p-3 hover:text-[#a1faff] transition-all active:scale-90 duration-300 ease-out"
            href="#">
            <span class="material-symbols-outlined text-2xl mb-1" data-icon="settings">settings</span>
            <span class="font-['Inter'] text-[10px] uppercase tracking-[0.1rem] font-bold">Settings</span>
        </a>
    </nav>
</body>

</html>
